name: Typecheck

# `vite build` strips types without checking them, and no other workflow here
# runs tsc — which is how this branch accumulated 133 type errors unnoticed,
# several of them real runtime bugs (see 66fe288d). This is the gate at source;
# prinny-client's build.yml gates the release pipeline on the same command.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

# Checkout + `tsc` only; nothing here writes to the repo or its packages.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # `npm ci`, never `npm install`. Only a clean install resolves the
      # lockfile's actual @types; a node_modules grown by successive installs
      # keeps stale ones hoisted and reports a false 0 errors.
      - run: npm ci

      - run: npm run typecheck
