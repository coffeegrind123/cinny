name: Check PR title

on:
  pull_request_target:
    types:
      - opened
      - edited

# `pull_request_target` runs with repository secrets on a token an outsider can
# trigger, so pin it to the minimum: this job only reads the PR title.
permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
