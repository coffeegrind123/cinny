# Docs: <https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/customizing-dependency-updates>
#
# Dependabot owns EVERY ecosystem here: npm, github-actions and docker.
#
# It previously owned only the last two, because `.github/renovate.json` was
# written to own npm. That never worked: **Renovate is not installed on this
# repository** — no Renovate PRs, no Renovate branches — and Issues are
# disabled, so the dependency dashboard that its `:dependencyDashboardApproval`
# gates every routine npm update behind cannot be created at all. Renovate's
# `vulnerabilityAlerts` block, the part meant to make security patches land
# without a human ticking a box, is inert for the same reason.
#
# The consequence was measured, not theorised: 22 npm advisories accumulated,
# 10 of them high, including arbitrary JavaScript execution from a malicious PDF
# in a client that renders PDFs strangers send you. See DEPENDENCY_AUDIT.md §1.
#
# Note that this file governs *version* updates only. Dependabot *security*
# updates are a repository setting; alerts and automated security fixes were
# switched on for this repo and coffeegrind123/prinny-client on 2026-08-11.
#
# If Renovate is ever actually installed, disable npm on ONE of the two before
# it opens competing PRs on the same manifest — never both at once.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: "tuesday"
      time: "01:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "tuesday"
      time: "01:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: "tuesday"
      time: "01:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 5
