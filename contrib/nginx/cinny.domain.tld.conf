server {
    listen 80;
    listen [::]:80;
    server_name cinny.domain.tld;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        alias /var/lib/letsencrypt/.well-known/acme-challenge/;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name cinny.domain.tld;

    # ---------------------------------------------------------------------
    # Security headers.
    #
    # Cinny renders untrusted third-party HTML (room messages), so this CSP is
    # the compensating control if the sanitiser is ever bypassed.
    #
    # Why each source is present:
    #   script-src   'self'                only bundled, same-origin scripts;
    #                                      index.html has no inline script.
    #                'wasm-unsafe-eval'    matrix-sdk-crypto-wasm (E2EE) and
    #                                      Element Call instantiate WebAssembly.
    #                'sha256-...' x2       the two inline scripts inside the
    #                                      vendored Element Call iframe document
    #                                      (public/element-call/index.html).
    #                google/gstatic        react-google-recaptcha loads
    #                                      recaptcha/api.js during registration.
    #   connect-src  https: wss:           arbitrary user-chosen homeservers,
    #                                      sliding-sync and LiveKit SFUs.
    #   img/media    https: blob: data:    media from arbitrary homeservers, plus
    #                                      decrypted attachments as blob: URLs.
    #   style-src    'unsafe-inline'       React/vanilla-extract inline styles.
    #   worker-src   blob:                 pdf.js and LiveKit E2EE workers.
    #   frame-src    https:                URL-preview embeds (YouTube/Piped,
    #                                      Bandcamp) and the reCAPTCHA frame.
    #
    # Regenerate the Element Call hashes after bumping
    # @element-hq/element-call-embedded — see the snippet in docker-nginx.conf.
    # ---------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-pQY0fuQAnnVQH5nQfjo80rzGkQzeN3JeAtAJ+1KcD4k=' 'sha256-3042zLa3JXvrJe/2n8P/XpIKwqBdNTu7fwbLZUNrzZQ=' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://recaptcha.net/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob: data:; media-src 'self' https: blob: data:; font-src 'self' data:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; manifest-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), browsing-topics=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    # TLS vhost, so HSTS belongs here. Drop `preload` (and shorten max-age)
    # until you are certain every subdomain is HTTPS-only.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        root /opt/cinny/dist/;

        rewrite ^/config.json$ /config.json break;
        rewrite ^/manifest.json$ /manifest.json break;

        rewrite ^/sw.js$ /sw.js break;
        rewrite ^/pdf.worker.min.js$ /pdf.worker.min.js break;

        rewrite ^/public/(.*)$ /public/$1 break;
        rewrite ^/assets/(.*)$ /assets/$1 break;

        rewrite ^(.+)$ /index.html break;
    }

    # Never serve dotfiles (a stray .git/.env under the docroot would otherwise
    # be public).
    location ~ /\. {
        deny all;
    }
}
